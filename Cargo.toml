[workspace]
resolver = "2"
members = [
    "crates/wiktor-core",
    "crates/wiktor-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/eacape/wiktor"

[workspace.dependencies]
# 异步运行时
tokio = { version = "1.40", features = ["full"] }

# 存储与序列化
diesel = { version = "2.2", features = ["sqlite"] }
diesel_migrations = { version = "2.2", features = ["sqlite"] }
# bundled SQLite：diesel 无 sqlite-bundled feature，需显式带 libsqlite3-sys bundled
libsqlite3-sys = { version = "0.30", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml_ng = "0.10"

# 解析（不重复造轮子：frontmatter / Markdown）
gray_matter = "0.2"
pulldown-cmark = "0.12"

# 向量检索（qdrant 外部服务，optional dependency in wiktor-core）
qdrant-client = { version = "1.19", default-features = false }

# 哈希与 ID
blake3 = "1.5"
uuid = { version = "1.10", features = ["v4", "serde"] }

# 错误处理
thiserror = "1.0"
anyhow = "1.0"

# 图（QUG 查询理解图用 petgraph DiGraph；不手写邻接表）
# Graph (petgraph DiGraph for the QUG query-understanding graph; no hand-rolled adjacency lists)
petgraph = "0.6"

# 日志（QueryEngine 统一写查询日志，日志写入失败用 tracing 报告）
# Logging (QueryEngine writes query logs centrally; tracing reports log-write failures)
tracing = "0.1"

# CLI 人类日志输出到 stderr（Step 4 §9：--json 时 stdout 只有一份 JSON）
# CLI human logs go to stderr (Step 4 §9: with --json stdout carries only one JSON)
tracing-subscriber = "0.3"

# LLM 编译管线（Step 4，llm-openai feature）：async-openai 仅隔离在 LlmClient
# 适配器内（D1：供应商 DTO 不越过适配器）；reqwest 与 SDK 同版同 TLS 栈，
# 仅供适配器实现单请求语义（关闭自动重试/读取 Retry-After/响应体积上限）。
# LLM compile pipeline (Step 4, llm-openai feature): async-openai stays isolated
# behind the LlmClient adapter (D1: vendor DTOs never cross the adapter); reqwest
# matches the SDK version and TLS stack so the adapter can implement single-request
# semantics (no auto-retry / Retry-After read / response size cap).
async-openai = { version = "0.28", default-features = false, features = ["rustls"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }

# CLI
clap = { version = "4.5", features = ["derive", "env"] }

# 测试
tempfile = "3.12"
