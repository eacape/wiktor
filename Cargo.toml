[workspace]
resolver = "2"
members = [
    "crates/wiktor-core",
    "crates/wiktor-cli",
    "crates/wiktor-feedback",
    "crates/wiktor-server",
    "crates/wiktor-vector-qdrant",
    "crates/wiktor-adapter-meilisearch",
    "crates/wiktor-console",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/eacape/wiktor"

[workspace.dependencies]
# 异步运行时
tokio = { version = "1.40", features = ["full"] }

# 存储与序列化
diesel = { version = "2.2", features = ["sqlite"] }
diesel_migrations = { version = "2.2", features = ["sqlite"] }
# bundled SQLite：diesel 无 sqlite-bundled feature，需显式带 libsqlite3-sys bundled
libsqlite3-sys = { version = "0.30", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml_ng = "0.10"

# 解析（不重复造轮子：frontmatter / Markdown）
gray_matter = "0.2"
pulldown-cmark = "0.12"

# 向量检索（qdrant 外部服务，wiktor-vector-qdrant 插件 crate 使用；core 不再依赖）
# Vector search (the qdrant external service, used by the wiktor-vector-qdrant
# plugin crate; core no longer depends on it)
qdrant-client = { version = "1.19", default-features = false }

# 哈希与 ID
blake3 = "1.5"
uuid = { version = "1.10", features = ["v4", "serde"] }

# 版本比较（Step8 §5.1/§6.4：strict semver 解析与兼容范围比较；禁止手写版本
# 排序/比较，serde feature 供 domain.yaml compatibility 段与 dependencies_json
# 快照直接序列化）。
# Version comparison (Step8 §5.1/§6.4: strict semver parsing and compatibility
# range checks; hand-rolled version ordering/comparison is forbidden. The serde
# feature lets the domain.yaml compatibility section and dependencies_json
# snapshots round-trip directly).
semver = { version = "1.0", features = ["serde"] }

# 错误处理
thiserror = "1.0"
anyhow = "1.0"

# 图（QUG 查询理解图用 petgraph DiGraph；不手写邻接表）
# Graph (petgraph DiGraph for the QUG query-understanding graph; no hand-rolled adjacency lists)
petgraph = "0.6"

# 日志（QueryEngine 统一写查询日志，日志写入失败用 tracing 报告）
# Logging (QueryEngine writes query logs centrally; tracing reports log-write failures)
tracing = "0.1"

# 协作取消（Step8 §6.3/D8/D9：LeaseReaper 与心跳任务用
# tokio_util::sync::CancellationToken；仓库原无取消原语惯例，取 spec 字面类型，
# default-features=false 最小引入——sync 模块无需任何 feature）。
# Cooperative cancellation (Step8 §6.3/D8/D9: the LeaseReaper and heartbeat tasks
# use tokio_util::sync::CancellationToken; the repo had no cancellation primitive
# convention, so the spec-literal type wins — default-features=false keeps it
# minimal, the sync module needs no feature).
tokio-util = { version = "0.7", default-features = false }

# CLI 人类日志输出到 stderr（Step 4 §9：--json 时 stdout 只有一份 JSON）
# CLI human logs go to stderr (Step 4 §9: with --json stdout carries only one JSON)
tracing-subscriber = "0.3"

# LLM 编译管线（Step 4，llm-openai feature）：async-openai 仅隔离在 LlmClient
# 适配器内（D1：供应商 DTO 不越过适配器）；reqwest 与 SDK 同版同 TLS 栈，
# 仅供适配器实现单请求语义（关闭自动重试/读取 Retry-After/响应体积上限）。
# LLM compile pipeline (Step 4, llm-openai feature): async-openai stays isolated
# behind the LlmClient adapter (D1: vendor DTOs never cross the adapter); reqwest
# matches the SDK version and TLS stack so the adapter can implement single-request
# semantics (no auto-retry / Retry-After read / response size cap).
async-openai = { version = "0.28", default-features = false, features = ["rustls"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }

# CLI
clap = { version = "4.5", features = ["derive", "env"] }

# HTTP server（Step 6 批5，spec step6 §3 D2：axum 0.7 + tower 0.5，仅
# POST /feedback、GET /health、GET /metrics 三路 endpoint）。
# HTTP server (Step 6 batch 5, spec step6 §3 D2: axum 0.7 + tower 0.5, only the
# three endpoints POST /feedback, GET /health, GET /metrics).
axum = "0.7"
tower = "0.5"

# gRPC（Step 7 落地依赖 #7，spec step7 §3 D1/D12：tonic 主协议 + prost 消息；
# 仅 wiktor-server 直接依赖，core 不引 gRPC；tonic-prost-build 需 protoc 生成
# 代码——tonic-build 0.14 已把 prost codegen 迁到独立的 tonic-prost-build）。
# gRPC (Step 7 dependency #7, spec step7 §3 D1/D12: tonic as the primary
# protocol + prost messages; only wiktor-server depends on it directly, core
# never imports gRPC; tonic-prost-build needs protoc to generate code —
# tonic-build 0.14 moved prost codegen to the separate tonic-prost-build crate).
tonic = "0.14"
tonic-prost = "0.14"
tonic-prost-build = "0.14"
prost = "0.14"

# 测试（Step 6 批5）：tower oneshot 的响应体收集，与 axum 0.7 的 http-body 1.x
# 配套（http-body-util 0.1 是 axum 0.7 的既有传递配套版本）。
# Tests (Step 6 batch 5): response-body collection for tower oneshot, matching
# axum 0.7's http-body 1.x stack (http-body-util 0.1 is the existing transitive
# companion version).
http-body-util = "0.1"

# 测试
tempfile = "3.12"
