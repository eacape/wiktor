[workspace]
resolver = "2"
members = [
    "crates/wiktor-core",
    "crates/wiktor-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/wiktor-rs/wiktor"

[workspace.dependencies]
# 异步运行时
tokio = { version = "1.40", features = ["full"] }

# 存储与序列化
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# 向量检索（qdrant 外部服务，optional dependency in wiktor-core）
qdrant-client = { version = "1.19", default-features = false }

# 哈希与 ID
blake3 = "1.5"
uuid = { version = "1.10", features = ["v4", "serde"] }

# 错误处理
thiserror = "1.0"
anyhow = "1.0"

# CLI
clap = { version = "4.5", features = ["derive", "env"] }

# 测试
tempfile = "3.12"
