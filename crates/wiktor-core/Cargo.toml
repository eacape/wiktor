[package]
name = "wiktor-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "The Wiktor kernel: two-plane SQLite store (diesel + FTS5), QueryEngine, QUG graph, compile pipeline, consistency/compatibility arbiters, and the Mock vector baseline."
documentation = "https://docs.rs/wiktor-core"

[dependencies]
diesel = { workspace = true }
diesel_migrations = { workspace = true }
libsqlite3-sys = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml_ng = { workspace = true }
gray_matter = { workspace = true }
pulldown-cmark = { workspace = true }
thiserror = { workspace = true }
blake3 = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
uuid = { workspace = true }
async-trait = "0.1"
petgraph = { workspace = true }
moka = { workspace = true }
tracing = { workspace = true }
async-openai = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
semver = { workspace = true }

[features]
# Qdrant 后端已拆出为独立插件 crate `wiktor-vector-qdrant`（STEP10 B3）：core
# 不再携带 qdrant-client，默认 feature 无向量后端依赖；MockVectorStore（评测
# 基线）常开。
# The Qdrant backend was split into the `wiktor-vector-qdrant` plugin crate
# (STEP10 B3): core no longer carries qdrant-client and the default features pull
# no vector backend; MockVectorStore (eval baseline) stays always-on.
default = []
# llm-openai：async-openai/ollama 单请求适配器（spec §4/§12 步骤 6）。tokio 已是
# 基础依赖（非 optional，不能进 feature 列表）。CLI 的同名 feature 转发由后续批次实现。
# llm-openai: the async-openai/ollama single-request adapter (spec §4/§12 step 6).
# tokio is already a non-optional base dependency and cannot appear in the feature
# list. CLI feature forwarding lands in a later batch.
llm-openai = ["dep:async-openai", "dep:reqwest"]
# embedding-http：真实嵌入客户端（OpenAI 兼容 /embeddings，默认阿里 MaaS
# qwen3.7-text-embedding-flash）。与 llm-openai 共用 reqwest/rustls 栈与
# API_KEY_ENV 兜底，因此透传 llm-openai；key/端点/模型全走环境变量（见
# src/embedding/mod.rs）。
# embedding-http: the real embedding client (OpenAI-compatible /embeddings,
# default Aliyun MaaS qwen3.7-text-embedding-flash). It shares the
# reqwest/rustls stack and the API_KEY_ENV fallback with llm-openai, so it
# forwards that feature; key/endpoint/model come from env vars (see
# src/embedding/mod.rs).
embedding-http = ["dep:reqwest", "llm-openai"]

[dev-dependencies]
tempfile = { workspace = true }
criterion = "0.5"
tokio = { workspace = true }

[[bench]]
name = "query_bench"
harness = false
