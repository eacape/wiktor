[package]
name = "wiktor-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "The Wiktor service face: unified gRPC (six services) and HTTP (axum) with method-level API keys, health, metrics, and feedback ingestion."
documentation = "https://docs.rs/wiktor-server"

[dependencies]
# 依赖边界（A1 / spec step6 §4）：core（存储与反馈实现）+ feedback（FeedbackStore
# trait 契约面，server → feedback 单向允许）；core/feedback 均不得反向依赖本 crate。
# Dependency boundaries (A1 / spec step6 §4): core (storage + feedback impl) plus
# feedback (the FeedbackStore trait contract face; the one-way server → feedback
# edge is allowed); neither core nor feedback may depend back on this crate.
wiktor-core = { path = "../wiktor-core" }
wiktor-feedback = { path = "../wiktor-feedback" }

# HTTP 面（spec step6 §3 D2）：axum 0.7 + tokio 多线程 runtime；tower 0.5 仅
# 使用 axum 传递层能力（本 crate 直接依赖以便后续 middleware 扩展）；serde
# derive + serde_json 解析请求体；tracing 服务端日志；blake3 生成 key 标签
# （原文不进标签/日志/指标，D8）。
# HTTP surface (spec step6 §3 D2): axum 0.7 + tokio multi-thread runtime; tower
# 0.5 only uses axum's transitive layer capabilities (declared directly for
# future middleware extensions); serde derive + serde_json parse request
# bodies; tracing for server-side logs; blake3 derives key labels (raw secrets
# never enter labels/logs/metrics, D8).
axum = { workspace = true }
tokio = { workspace = true }
tower = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml_ng = { workspace = true }
tracing = { workspace = true }
blake3 = { workspace = true }

# gRPC 面（Step 7 落地依赖 #7，spec step7 §3 D1/D12）：tonic 主协议 + tonic-prost
# 消息 + prost；仅本 crate 直接依赖，core 不引 gRPC（§1 非目标）。
# gRPC surface (Step 7 dependency #7, spec step7 §3 D1/D12): tonic as the
# primary protocol + tonic-prost messages + prost; only this crate depends on
# them directly, core never imports gRPC (§1 non-goal).
tonic = { workspace = true }
tonic-prost = { workspace = true }
prost = { workspace = true }
tokio-util = { workspace = true }

[features]
# serve 常驻编译 worker 的真实 LLM 装配（Step0b）：打开 core 的 llm-openai，让
# worker 按 env（WIKTOR_LLM_BASE_URL/WIKTOR_LLM_MODEL/WIKTOR_OPENAI_API_KEY）在
# from_domain_pack 里用 LlmCompiler 代替 MockCompiler。env 未设时仍回退 Mock。
# Real-LLM assembly for the resident compile worker (Step0b): enable core's
# llm-openai so the worker can swap in LlmCompiler for MockCompiler per env
# (WIKTOR_LLM_BASE_URL / WIKTOR_LLM_MODEL / WIKTOR_OPENAI_API_KEY). Falls back to
# Mock when the env is unset.
default = ["llm-openai"]
llm-openai = ["wiktor-core/llm-openai"]

[build-dependencies]
tonic-prost-build = { workspace = true }

[dev-dependencies]
# tower oneshot + http-body-util：离线（不联网）的 router 请求/响应驱动，验证
# A5–A8/A17。
# tower oneshot + http-body-util: offline (no network) router request/response
# driving, verifying A5–A8/A17.
tower = { workspace = true, features = ["util"] }
http-body-util = { workspace = true }

# 并发 smoke（Step 6 批7 / A18）：同库临时文件 + 两连接（server/CLI 角色）。
# Concurrency smoke (Step 6 batch 7 / A18): a temp file DB + two connections
# (server / CLI roles).
tempfile = { workspace = true }
